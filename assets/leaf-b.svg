    <path d="M50 172 Q48 100 50 26" stroke="#7a3a14" stroke-opacity=".55" stroke-width="1.4" fill="none"/>
    <g stroke="#7a3a14" stroke-opacity=".35" stroke-width="1" fill="none">
      <path d="M50 146 L30 126"/><path d="M50 146 L70 126"/>
